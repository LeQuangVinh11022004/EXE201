name: exe_201
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  font_awesome_flutter: ^10.7.0
  fluttertoast: ^8.2.8
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  flutter_facebook_auth: ^7.0.1
  cupertino_icons: ^1.0.8
  provider: ^6.0.0
  http: ^1.2.1
  http_client: ^1.5.3
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.2.3
  flutter_cache_manager: ^3.3.1
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2
  url_launcher: ^6.3.1
  flutter_inappwebview: ^6.1.0
  shared_preferences: ^2.1.0
  in_app_purchase: ^3.2.0
  jwt_decode: ^0.3.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  app_links: ^6.4.0
  intl: ^0.19.0
  signalr_netcore: ^1.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false # vì bạn chỉ cần Android
  image_path: "assets/logo_app_exe201.jpg" # đường dẫn đến icon của bạn

flutter:
  uses-material-design: true
  assets:
    - assets/momandbaby_login.jpg
    - assets/placeholder_doctor.jpg
    - assets/logo_app_exe201.jpg
fonts:
  - family: Poppins
    fonts:
      - asset: fonts/Poppins-Regular.ttf
      - asset: fonts/Poppins-SemiBold.ttf
        weight: 600
      - asset: fonts/Poppins-Bold.ttf
        weight: 700